services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: edgeplay-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: edgeplay
      DB_USERNAME: edgeplay
      DB_PASSWORD: edgeplay
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.0
    container_name: edgeplay-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: edgeplay
      MYSQL_USER: edgeplay
      MYSQL_PASSWORD: edgeplay
      MYSQL_ROOT_PASSWORD: edgeplay_root
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - edgeplay_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pedgeplay_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  edgeplay_mysql:
